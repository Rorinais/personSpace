# Nginx 配置 — Rorinais 个人网站
# 部署路径: 将 build/ 目录内容放到 /var/www/rorinais/
# 启用: sudo ln -s /etc/nginx/sites-available/rorinais /etc/nginx/sites-enabled/
# 重载: sudo nginx -t && sudo nginx -s reload

server {
    listen 80;
    server_name rorinais.cn www.rorinais.cn;

    root /var/www/rorinais;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # 静态资源缓存（带 hash 的文件长期缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 图片缓存
    location /images/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA 回退：所有路径都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}

